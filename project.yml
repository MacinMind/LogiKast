name: iceKast
options:
  bundleIdPrefix: com.macinmind
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0b2"
    CURRENT_PROJECT_VERSION: "1.0.0.5.2"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: 2D3239GKS4
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Xcode otherwise adds the debugging entitlement get-task-allow, which Apple refuses to notarize.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  iceKast:
    type: application
    platform: macOS
    sources:
      - iceKast
      - Feeder/FeedModels.swift
    info:
      path: iceKast/Info.plist
      properties:
        CFBundleDisplayName: iceKast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© MacinMind Software, Inc. Free software (GPLv2)."
    entitlements:
      path: iceKast/iceKast.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macinmind.icekast
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle Icecast
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/build/icecast"
          if [ ! -x "$SRC/icecast" ]; then
            echo "error: build/icecast/icecast missing. Run scripts/build-icecast.sh first."
            exit 1
          fi
          APP="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$APP/Helpers" "$APP/Resources/icecast-share" "$APP/Library/LaunchAgents"
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          [ -z "$ID" ] && ID="-"
          # Release builds get Apple's secure timestamp (needed for Developer ID / notarization).
          TS="--timestamp=none"; [ "${CONFIGURATION:-}" = "Release" ] && TS="--timestamp"
          # Only replace the bundled icecast when it changed. In a dev
          # build the running background server executes this very file, and rewriting or
          # re-signing it would make macOS kill the server and drop live streams.
          STAMP_FILE="$TARGET_TEMP_DIR/icecast.stamp"
          STAMP="$(shasum -a 256 "$SRC/icecast" | cut -d' ' -f1)"
          if [ ! -x "$APP/Helpers/icecast" ] || [ "$(cat "$STAMP_FILE" 2>/dev/null)" != "$STAMP" ]; then
            cp "$SRC/icecast" "$APP/Helpers/icecast"
            codesign --force --options runtime $TS --sign "$ID" "$APP/Helpers/icecast"
            echo "$STAMP" > "$STAMP_FILE"
          fi
          rsync -a --delete "$SRC/share/" "$APP/Resources/icecast-share/"
          # Launcher run by launchd; universal, built here so it matches the app's deployment target.
          LSTAMP_FILE="$TARGET_TEMP_DIR/launcher.stamp"
          LSTAMP="$(cat "$SRCROOT/Launcher/icekast-launch.c" | shasum -a 256 | cut -d' ' -f1)"
          if [ ! -x "$APP/Helpers/icekast-launch" ] || [ "$(cat "$LSTAMP_FILE" 2>/dev/null)" != "$LSTAMP" ]; then
            clang -O2 -arch arm64 -arch x86_64 -mmacosx-version-min=13.0 \
              "$SRCROOT/Launcher/icekast-launch.c" -o "$APP/Helpers/icekast-launch"
            codesign --force --options runtime $TS --sign "$ID" "$APP/Helpers/icekast-launch"
            echo "$LSTAMP" > "$LSTAMP_FILE"
          fi
          # Backup-audio feeder (Swift), universal, rebuilt only when its sources change.
          FSTAMP_FILE="$TARGET_TEMP_DIR/feeder.stamp"
          FSTAMP="$(cat "$SRCROOT"/Feeder/*.swift | shasum -a 256 | cut -d' ' -f1)"
          if [ ! -x "$APP/Helpers/icekast-feeder" ] || [ "$(cat "$FSTAMP_FILE" 2>/dev/null)" != "$FSTAMP" ]; then
            FT="$TARGET_TEMP_DIR/feeder-build"; mkdir -p "$FT"
            for arch in arm64 x86_64; do
              swiftc -O -swift-version 5 -target "$arch-apple-macos13.0" \
                "$SRCROOT/Feeder/main.swift" "$SRCROOT/Feeder/AudioFrames.swift" "$SRCROOT/Feeder/FeedModels.swift" \
                -o "$FT/feeder-$arch"
            done
            lipo -create "$FT/feeder-arm64" "$FT/feeder-x86_64" -output "$APP/Helpers/icekast-feeder"
            codesign --force --options runtime $TS --sign "$ID" "$APP/Helpers/icekast-feeder"
            echo "$FSTAMP" > "$FSTAMP_FILE"
          fi
          cp "$SRCROOT/Launcher/com.macinmind.icekast.server.plist" "$APP/Library/LaunchAgents/"
  iceKastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - iceKastTests
      - Feeder/AudioFrames.swift
    dependencies:
      - target: iceKast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iceKast.app/Contents/MacOS/iceKast"
schemes:
  iceKast:
    build:
      targets:
        iceKast: all
    test:
      targets:
        - iceKastTests
