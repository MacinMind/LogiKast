name: iceKast
options:
  bundleIdPrefix: com.macinmind
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: 2D3239GKS4
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
targets:
  iceKast:
    type: application
    platform: macOS
    sources:
      - iceKast
    info:
      path: iceKast/Info.plist
      properties:
        CFBundleDisplayName: iceKast
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© MacinMind Software, Inc. Free software (GPLv2)."
    entitlements:
      path: iceKast/iceKast.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macinmind.icekast
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle Icecast
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/build/icecast"
          if [ ! -x "$SRC/icecast" ]; then
            echo "error: build/icecast/icecast missing. Run scripts/build-icecast.sh first."
            exit 1
          fi
          APP="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$APP/Helpers" "$APP/Resources/icecast-share" "$APP/Library/LaunchAgents"
          cp "$SRC/icecast" "$APP/Helpers/icecast"
          rsync -a --delete "$SRC/share/" "$APP/Resources/icecast-share/"
          # Launcher run by launchd; universal, built here so it matches the app's deployment target.
          clang -O2 -arch arm64 -arch x86_64 -mmacosx-version-min=13.0 \
            "$SRCROOT/Launcher/icekast-launch.c" -o "$APP/Helpers/icekast-launch"
          cp "$SRCROOT/Launcher/com.macinmind.icekast.server.plist" "$APP/Library/LaunchAgents/"
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          [ -z "$ID" ] && ID="-"
          for b in icecast icekast-launch; do
            codesign --force --options runtime --timestamp=none --sign "$ID" "$APP/Helpers/$b"
          done
  iceKastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - iceKastTests
    dependencies:
      - target: iceKast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iceKast.app/Contents/MacOS/iceKast"
schemes:
  iceKast:
    build:
      targets:
        iceKast: all
    test:
      targets:
        - iceKastTests
