			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\nSRC=\"$SRCROOT/build/icecast\"\nif [ ! -x \"$SRC/icecast\" ]; then\n  echo \"error: build/icecast/icecast missing. Run scripts/build-icecast.sh first.\"\n  exit 1\nfi\nAPP=\"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH\"\nmkdir -p \"$APP/Helpers\" \"$APP/Resources/icecast-share\" \"$APP/Library/LaunchAgents\"\nID=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\n[ -z \"$ID\" ] && ID=\"-\"\n# Release builds get Apple's secure timestamp (needed for Developer ID / notarization).\nTS=\"--timestamp=none\"; [ \"${CONFIGURATION:-}\" = \"Release\" ] && TS=\"--timestamp\"\n# Only replace the bundled icecast when it changed. In a dev\n# build the running background server executes this very file, and rewriting or\n# re-signing it would make macOS kill the server and drop live streams.\nSTAMP_FILE=\"$TARGET_TEMP_DIR/icecast.stamp\"\nSTAMP=\"$(shasum -a 256 \"$SRC/icecast\" | cut -d' ' -f1)\"\nif [ ! -x \"$APP/Helpers/icecast\" ] || [ \"$(cat \"$STAMP_FILE\" 2>/dev/null)\" != \"$STAMP\" ]; then\n  cp \"$SRC/icecast\" \"$APP/Helpers/icecast\"\n  codesign --force --options runtime $TS --sign \"$ID\" \"$APP/Helpers/icecast\"\n  echo \"$STAMP\" > \"$STAMP_FILE\"\nfi\nrsync -a --delete \"$SRC/share/\" \"$APP/Resources/icecast-share/\"\n# Launcher run by launchd; universal, built here so it matches the app's deployment target.\nLSTAMP_FILE=\"$TARGET_TEMP_DIR/launcher.stamp\"\nLSTAMP=\"$(cat \"$SRCROOT/Launcher/logikast-launch.c\" | shasum -a 256 | cut -d' ' -f1)\"\nif [ ! -x \"$APP/Helpers/logikast-launch\" ] || [ \"$(cat \"$LSTAMP_FILE\" 2>/dev/null)\" != \"$LSTAMP\" ]; then\n  clang -O2 -arch arm64 -arch x86_64 -mmacosx-version-min=13.0 \\\n    \"$SRCROOT/Launcher/logikast-launch.c\" -o \"$APP/Helpers/logikast-launch\"\n  codesign --force --options runtime $TS --sign \"$ID\" \"$APP/Helpers/logikast-launch\"\n  echo \"$LSTAMP\" > \"$LSTAMP_FILE\"\nfi\n# Backup-audio feeder (Swift), universal, rebuilt only when its sources change.\nFSTAMP_FILE=\"$TARGET_TEMP_DIR/feeder.stamp\"\nFSTAMP=\"$(cat \"$SRCROOT\"/Feeder/*.swift | shasum -a 256 | cut -d' ' -f1)\"\nif [ ! -x \"$APP/Helpers/logikast-feeder\" ] || [ \"$(cat \"$FSTAMP_FILE\" 2>/dev/null)\" != \"$FSTAMP\" ]; then\n  FT=\"$TARGET_TEMP_DIR/feeder-build\"; mkdir -p \"$FT\"\n  for arch in arm64 x86_64; do\n    swiftc -O -swift-version 5 -target \"$arch-apple-macos13.0\" \\\n      \"$SRCROOT/Feeder/main.swift\" \"$SRCROOT/Feeder/AudioFrames.swift\" \"$SRCROOT/Feeder/FeedModels.swift\" \\\n      -o \"$FT/feeder-$arch\"\n  done\n  lipo -create \"$FT/feeder-arm64\" \"$FT/feeder-x86_64\" -output \"$APP/Helpers/logikast-feeder\"\n  codesign --force --options runtime $TS --sign \"$ID\" \"$APP/Helpers/logikast-feeder\"\n  echo \"$FSTAMP\" > \"$FSTAMP_FILE\"\nfi\ncp \"$SRCROOT/Launcher/com.macinmind.logikast.server.plist\" \"$APP/Library/LaunchAgents/\"\n";
		};
